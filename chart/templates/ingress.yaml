{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swap-routing-api-ingress
  namespace: {{ include "swapRoutingApi.namespace" . }}
  labels:
    {{- include "swapRoutingApi.labels" . | nindent 4 }}
    {{- with .Values.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.services.api.hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: {{ $.Values.ingress.services.api.path }}
            pathType: {{ $.Values.ingress.services.api.pathType }}
            backend:
              service:
                name: {{ $.Values.ingress.services.api.service.name }}
                port:
                  name: {{ $.Values.ingress.services.api.service.port.name }}
    {{- end }}
{{- end }}
