apiVersion: apps/v1
kind: Deployment
metadata:
  name: swap-routing-api
  labels:
    {{- include "swapRoutingApi.labels" . | nindent 4 }}
  namespace: {{ include "swapRoutingApi.namespace" . }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      {{- include "swapRoutingApi.labels" . | nindent 6 }}
  template:
    metadata:
      name: swap-routing-api
      labels:
        {{- include "swapRoutingApi.labels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: {{ .Values.images.api.repo }}:{{ .Values.images.api.tag }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          env:
            - name: PORT
              value: "{{ .Values.ports.api }}"
            - name: RPC_ENDPOINT
              value: "{{ .Values.config.rpcEndpoint }}"
            - name: LOG_LEVEL
              value: "{{ .Values.config.logLevel }}"
          ports:
            - containerPort: {{ .Values.ports.api }}
              name: api
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
